name: workbench-acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/prepare_evidence.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: python scripts/verify.py --full-chain
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/native_acceptance.py
      - run: python scripts/bootstrap.py --yes --no-browser
      - run: python -m pip freeze
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.os }}
          path: |
            evidence/run-context.json
            evidence/verification.json
            evidence/full-chain-http.json
            evidence/native-service-browser.json
            evidence/native-service-command.json
            evidence/source-guard.json
            evidence/*-browser-events.jsonl
            evidence/*-process-events.jsonl
            evidence/pytest-progress.jsonl
            evidence/*.log
            evidence/*.xml
            evidence/ui-current-*.png
          retention-days: 14
  product-audit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/prepare_evidence.py
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      # Bind every native audit to the explicitly reviewed application revision.
      # Every probe must pass; failed or incomplete evidence remains a failure.
      - run: python scripts/native_acceptance.py --product-audit --expected-web-tree e2c04fef1051d098b653435903e2ce101477c199 --expected-server-tree 53bde360fb8692a426b23e1bff425a69248bb930
      - run: python scripts/pack_product_audit.py
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-audit-${{ matrix.os }}-summary
          path: |
            evidence/run-context.json
            evidence/product-browser-audit.json
            evidence/product-audit-service-command.json
            evidence/product-audit-transfer-status.json
            evidence/product-audit*.log
            evidence/product-audit*-events.jsonl
            evidence/product-audit-transfer/manifest.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-audit-${{ matrix.os }}-part-01
          path: evidence/product-audit-transfer/part-01/
          if-no-files-found: ignore
