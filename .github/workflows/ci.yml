name: workbench-acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: source
        shell: bash
        env:
          TARGET_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if test -f .delivery/assemble.py; then
            test "$TARGET_REF" = 'refs/heads/refactor/service-workbench-20260927'
            python .delivery/assemble.py
            npm ci --ignore-scripts
            npm run build
            python .delivery/assemble.py --check-build
            git config core.autocrlf false
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'feat: assemble verified service workbench source and compiled assets'
            git push origin HEAD:refs/heads/refactor/service-workbench-20260927
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  regression:
    needs: source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: python scripts/verify.py --full-chain
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/native_acceptance.py
      - run: python scripts/bootstrap.py --yes --no-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.os }}
          path: evidence/
  dependency-audit:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements.txt --strict --format json --output dependency-audit.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
  result:
    needs: [source, regression, dependency-audit]
    if: always() && needs.source.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v7
        env:
          VERIFIED_SHA: ${{ needs.source.outputs.sha }}
          REGRESSION_RESULT: ${{ needs.regression.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        with:
          script: |
            const ok = process.env.REGRESSION_RESULT === 'success' && process.env.AUDIT_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: process.env.VERIFIED_SHA,
              context: 'workbench/acceptance', state: ok ? 'success' : 'failure',
              description: ok ? 'Windows + Linux + native browser + dependency audit passed' : 'Acceptance failed; read actual job logs',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!ok) core.setFailed('One or more acceptance gates failed.');
