name: workbench-acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/prepare_evidence.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: python scripts/verify.py --full-chain
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/native_acceptance.py
      - run: python scripts/bootstrap.py --yes --no-browser
      - run: python -m pip freeze
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.os }}
          path: |
            evidence/run-context.json
            evidence/verification.json
            evidence/full-chain-http.json
            evidence/native-service-browser.json
            evidence/native-service-command.json
            evidence/source-guard.json
            evidence/*-browser-events.jsonl
            evidence/*-process-events.jsonl
            evidence/pytest-progress.jsonl
            evidence/*.log
            evidence/*.xml
            evidence/ui-current-*.png
          retention-days: 14
  product-audit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/prepare_evidence.py
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      # This first run holds application bytes to the reviewed e846 baseline.
      # Expected failures remain failures; capture successful and failed steps.
      - run: python scripts/native_acceptance.py --product-audit --expected-web-tree 8a717049f0e764753d7dd9e5db99d3902399906d --expected-server-tree ebab009cecd5cf01c6c76089986a5db5f0143af8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-audit-${{ matrix.os }}
          path: |
            evidence/run-context.json
            evidence/product-browser-audit.json
            evidence/product-audit-service-command.json
            evidence/product-audit*.log
            evidence/product-audit*-events.jsonl
            evidence/product-audit/
          retention-days: 14
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements.txt --strict --format json --output dependency-audit.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
          retention-days: 14
