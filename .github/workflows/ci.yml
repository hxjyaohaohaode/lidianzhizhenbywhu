      - run: python -m playwright install --with-deps chromium
      # L1 alone, with an independent account, native lifecycle and evidence.
      # The runner retains its existing 300-second bound; no L6 heavy setup.
      - run: python scripts/native_acceptance.py --product-first-use --expected-web-tree 7dbf518b25cb79e759313e4849ca35237bfa8865 --expected-server-tree 61c1025ccdd059c0249ba681a6a3c19a0e73a25d
